<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260" role="img" aria-labelledby="title desc">
  <title id="title">PixZig Field layer map</title>
  <desc id="desc">Detailed hierarchy of PixZig Field layers, including patch embedding, timestep embedding, ZigMa backbone, PixNerd head, and residual refiner.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#243447"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px Arial, sans-serif; fill: #142033; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #526074; }
      .panel { fill: #ffffff; stroke: #c5cedb; stroke-width: 2; rx: 10; }
      .module { fill: #edf4ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .zigma { fill: #eef8f0; stroke: #2f8f4e; stroke-width: 2; rx: 8; }
      .pixnerd { fill: #fff6e8; stroke: #bd6b00; stroke-width: 2; rx: 8; }
      .refiner { fill: #fff0f0; stroke: #be3b3b; stroke-width: 2; rx: 8; }
      .tensor { fill: #263245; stroke: #111827; stroke-width: 2; rx: 8; }
      .smallbox { fill: #ffffff; stroke: #617089; stroke-width: 1.6; rx: 6; }
      .repeat { fill: #f8fbff; stroke: #8391a6; stroke-width: 1.6; stroke-dasharray: 7 5; rx: 8; }
      .label { font: 700 17px Arial, sans-serif; fill: #152033; }
      .label-light { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .small { font: 400 13px Arial, sans-serif; fill: #516074; }
      .tiny { font: 400 11.5px Arial, sans-serif; fill: #637086; }
      .arrow { stroke: #243447; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #9aa7ba; stroke-width: 1.5; fill: none; }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1900" height="1260"/>
  <text class="title" x="60" y="58">PixZig Field - mapa detalhado de camadas</text>
  <text class="subtitle" x="60" y="87">Organizacao atual dos modulos PyTorch e dos blocos repetidos usados para predizer x0_pred.</text>

  <rect class="panel" x="45" y="120" width="1810" height="170"/>
  <text class="label" x="75" y="155">Fluxo principal do PixZigField.forward()</text>

  <rect class="tensor" x="80" y="185" width="165" height="70"/>
  <text class="label-light" x="105" y="214">x_t</text>
  <text class="small" x="105" y="237" fill="#dbe7ff">[B,C,H,W]</text>

  <rect class="module" x="295" y="185" width="180" height="70"/>
  <text class="label" x="320" y="214">patchify</text>
  <text class="small" x="320" y="237">patch grid</text>

  <rect class="module" x="525" y="185" width="210" height="70"/>
  <text class="label" x="550" y="214">patch_embed</text>
  <text class="small" x="550" y="237">Linear(patch_dim,H)</text>

  <rect class="module" x="790" y="185" width="200" height="70"/>
  <text class="label" x="815" y="214">t_embedder</text>
  <text class="small" x="815" y="237">Sinusoidal + MLP</text>

  <rect class="zigma" x="1040" y="185" width="210" height="70"/>
  <text class="label" x="1065" y="214">ZigMaBackbone</text>
  <text class="small" x="1065" y="237">depth x blocks</text>

  <rect class="pixnerd" x="1300" y="185" width="200" height="70"/>
  <text class="label" x="1325" y="214">PixNerdHead</text>
  <text class="small" x="1325" y="237">tokens -> x0_coarse</text>

  <rect class="refiner" x="1545" y="185" width="205" height="70"/>
  <text class="label" x="1570" y="214">ResidualRefiner</text>
  <text class="small" x="1570" y="237">x0_coarse + x_t</text>

  <path class="arrow" d="M245 220 H295"/>
  <path class="arrow" d="M475 220 H525"/>
  <path class="arrow" d="M735 220 H790"/>
  <path class="arrow" d="M990 220 H1040"/>
  <path class="arrow" d="M1250 220 H1300"/>
  <path class="arrow" d="M1500 220 H1545"/>

  <rect class="panel" x="45" y="325" width="420" height="340"/>
  <text class="label" x="75" y="360">Entrada e embeddings</text>

  <rect class="smallbox" x="75" y="390" width="350" height="58"/>
  <text class="label" x="95" y="414">patchify(x_t, patch_size)</text>
  <text class="tiny" x="95" y="436">F.unfold -> patches [B, N, C*P*P]</text>

  <rect class="smallbox" x="75" y="465" width="350" height="58"/>
  <text class="label" x="95" y="489">patch_embed</text>
  <text class="tiny" x="95" y="511">nn.Linear(in_channels*patch_size^2, hidden_dim)</text>

  <rect class="smallbox" x="75" y="540" width="350" height="88"/>
  <text class="label" x="95" y="564">TimestepEmbedder</text>
  <text class="tiny" x="95" y="586">sinusoidal_embedding(t, frequency_embedding_size)</text>
  <text class="tiny" x="95" y="606">Linear(freq_dim, hidden_dim)</text>
  <text class="tiny" x="95" y="626">SiLU -> Linear(hidden_dim, hidden_dim)</text>

  <rect class="panel" x="505" y="325" width="610" height="500"/>
  <text class="label" x="535" y="360">ZigMaBackbone</text>

  <rect class="smallbox" x="535" y="390" width="250" height="70"/>
  <text class="label" x="555" y="414">cond_proj opcional</text>
  <text class="tiny" x="555" y="436">Linear(cond_dim, hidden_dim)</text>
  <text class="tiny" x="555" y="454">cond_vec = t_embed + cond_proj(cond)</text>

  <rect class="repeat" x="535" y="485" width="535" height="245"/>
  <text class="label" x="560" y="518">_ZigZagMambaBlock x depth</text>
  <text class="tiny" x="560" y="540">cada bloco usa um caminho zigzag/inverso em grid_size</text>

  <rect class="zigma" x="560" y="565" width="155" height="60"/>
  <text class="label" x="580" y="590">LayerNorm</text>
  <text class="tiny" x="580" y="610">norm(scanned)</text>

  <rect class="zigma" x="745" y="565" width="185" height="60"/>
  <text class="label" x="765" y="590">AdaLN</text>
  <text class="tiny" x="765" y="610">SiLU -> Linear(3H)</text>

  <rect class="zigma" x="560" y="650" width="370" height="60"/>
  <text class="label" x="580" y="675">Mamba mixer</text>
  <text class="tiny" x="580" y="695">native: in_proj, depthwise Conv1d, selective scan, RMSNormGated, out_proj</text>

  <rect class="smallbox" x="955" y="565" width="90" height="145"/>
  <text class="label" x="975" y="590">Gate</text>
  <text class="tiny" x="975" y="612">residual</text>
  <text class="tiny" x="975" y="632">+ gate</text>
  <text class="tiny" x="975" y="652">* mixed</text>

  <rect class="smallbox" x="535" y="750" width="250" height="50"/>
  <text class="label" x="555" y="780">final_norm: LayerNorm(hidden_dim)</text>

  <path class="arrow" d="M715 595 H745"/>
  <path class="arrow" d="M745 625 V650"/>
  <path class="arrow" d="M930 680 H955"/>

  <rect class="panel" x="1155" y="325" width="700" height="500"/>
  <text class="label" x="1185" y="360">PixNerdHead</text>

  <rect class="smallbox" x="1185" y="390" width="290" height="80"/>
  <text class="label" x="1205" y="414">token_proj</text>
  <text class="tiny" x="1205" y="436">_PixNerdRMSNorm(hidden_dim)</text>
  <text class="tiny" x="1205" y="456">Linear(hidden_dim, pixnerd_hidden_dim)</text>

  <rect class="smallbox" x="1515" y="390" width="290" height="80"/>
  <text class="label" x="1535" y="414">t_proj</text>
  <text class="tiny" x="1535" y="436">Linear(hidden_dim, pixnerd_hidden_dim)</text>
  <text class="tiny" x="1535" y="456">cond = SiLU(token_proj + t_proj)</text>

  <rect class="smallbox" x="1185" y="495" width="290" height="98"/>
  <text class="label" x="1205" y="519">_NerfEmbedder</text>
  <text class="tiny" x="1205" y="541">local_patch_coordinates(patch_size)</text>
  <text class="tiny" x="1205" y="561">FourierFeatures(num_frequencies)</text>
  <text class="tiny" x="1205" y="581">Linear(out_channels + fourier_dim, pixnerd_hidden_dim)</text>

  <rect class="repeat" x="1515" y="495" width="290" height="205"/>
  <text class="label" x="1535" y="525">_FactorizedNerfBlock x pixnerd_layers</text>
  <text class="tiny" x="1535" y="550">_PixNerdRMSNorm</text>
  <text class="tiny" x="1535" y="570">base_fc1, base_fc2</text>
  <text class="tiny" x="1535" y="590">param_generator: SiLU -> Linear -> SiLU -> Linear</text>
  <text class="tiny" x="1535" y="610">dynamic low-rank fc1/fc2</text>
  <text class="tiny" x="1535" y="630">residual_gate: SiLU -> Linear</text>
  <text class="tiny" x="1535" y="650">bmm -> SiLU -> bmm -> gated residual</text>

  <rect class="smallbox" x="1185" y="630" width="290" height="70"/>
  <text class="label" x="1205" y="654">final decode</text>
  <text class="tiny" x="1205" y="676">final_norm: _PixNerdRMSNorm</text>
  <text class="tiny" x="1205" y="694">final: Linear(pixnerd_hidden_dim, out_channels)</text>

  <rect class="smallbox" x="1185" y="730" width="620" height="70"/>
  <text class="label" x="1205" y="758">unpatchify</text>
  <text class="tiny" x="1205" y="780">patch pixels [B,N,out_channels*P*P] -> x0_coarse [B,C,H,W]</text>

  <path class="arrow" d="M1475 430 H1515"/>
  <path class="arrow" d="M1475 544 H1515"/>
  <path class="arrow" d="M1660 700 V730"/>

  <rect class="panel" x="45" y="860" width="1810" height="310"/>
  <text class="label" x="75" y="895">ResidualConvRefiner e saida</text>

  <rect class="refiner" x="75" y="930" width="285" height="75"/>
  <text class="label" x="95" y="958">inputs</text>
  <text class="tiny" x="95" y="980">x0_coarse concat x_t se refiner_use_xt=True</text>

  <rect class="refiner" x="410" y="930" width="245" height="75"/>
  <text class="label" x="430" y="958">in_proj</text>
  <text class="tiny" x="430" y="980">Conv2d(in_channels, refiner_channels)</text>

  <rect class="repeat" x="705" y="905" width="405" height="135"/>
  <text class="label" x="730" y="935">_ResidualConvBlock x refiner_blocks</text>
  <text class="tiny" x="730" y="960">GroupNorm -> FiLM opcional -> SiLU -> Conv2d</text>
  <text class="tiny" x="730" y="982">GroupNorm -> FiLM opcional -> SiLU -> Conv2d</text>
  <text class="tiny" x="730" y="1004">residual: x + h</text>
  <text class="tiny" x="730" y="1024">cond_proj opcional: SiLU -> Linear(cond_dim, 4*channels)</text>

  <rect class="refiner" x="1160" y="930" width="220" height="75"/>
  <text class="label" x="1180" y="958">out_norm</text>
  <text class="tiny" x="1180" y="980">GroupNorm(1, channels)</text>

  <rect class="refiner" x="1430" y="930" width="220" height="75"/>
  <text class="label" x="1450" y="958">out_proj</text>
  <text class="tiny" x="1450" y="980">Conv2d(channels, out_channels)</text>

  <rect class="tensor" x="75" y="1070" width="295" height="60"/>
  <text class="label-light" x="95" y="1098">saida final</text>
  <text class="small" x="95" y="1120" fill="#dbe7ff">x0_pred = x0_coarse + residual</text>

  <rect class="smallbox" x="430" y="1070" width="610" height="60"/>
  <text class="label" x="450" y="1098">Observacao sobre repeticoes</text>
  <text class="tiny" x="450" y="1120">ZigMa repete por depth; PixNerd repete por pixnerd_layers; Refiner repete por refiner_blocks.</text>

  <rect class="smallbox" x="1100" y="1070" width="550" height="60"/>
  <text class="label" x="1120" y="1098">Condicionamento</text>
  <text class="tiny" x="1120" y="1120">t_embed condiciona ZigMa, PixNerd e Refiner; Qwen cond entra no ZigMa quando cond_dim esta configurado.</text>

  <path class="arrow" d="M360 967 H410"/>
  <path class="arrow" d="M655 967 H705"/>
  <path class="arrow" d="M1110 967 H1160"/>
  <path class="arrow" d="M1380 967 H1430"/>
  <path class="arrow" d="M1540 1005 C1490 1060, 430 1050, 370 1098"/>
</svg>
